[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "m1-snippets"
version = "0.1.0"
description = "A small desktop snippet manager backed by M1 transport data."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "CC0-1.0"}
dependencies = [
    "lionscliapp>=0.1.2",
]

[project.scripts]
snippets = "m1snippets.app:main"

[tool.setuptools.packages.find]
where = ["src"]
